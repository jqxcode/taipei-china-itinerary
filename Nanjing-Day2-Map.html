<body><div class="wrap"><h1>南京 Day 2（2026-09-16 周三）九号汤泉全日</h1><p class="sub">10:00–20:30 全日低强度洗浴/餐食/休息，取消钟山与玄武湖。 <a href="https://www.google.com/maps/dir/32.0308,118.7845/31.9935,118.7225/32.0308,118.7845" target="_blank" rel="noopener">打开多点路线</a></p><div id="map"></div><ol><li><b>1. 夫子庙/新街口酒店区</b> — 早餐后出发</li>
<li><b>2. 九号汤泉生活馆（南京店）</b> — 青奥北路5号；泡浴、餐食、休息区，可选按摩</li>
<li><b>3. 酒店区</b> — 约20:30离场返回</li></ol></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const pts=[{"name": "夫子庙/新街口酒店区", "lat": 32.0308, "lon": 118.7845, "note": "早餐后出发"}, {"name": "九号汤泉生活馆（南京店）", "lat": 31.9935, "lon": 118.7225, "note": "青奥北路5号；泡浴、餐食、休息区，可选按摩"}, {"name": "酒店区", "lat": 32.0308, "lon": 118.7845, "note": "约20:30离场返回"}];const map=L.map('map');L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
const bounds=[];pts.forEach((p,i)=>{const m=L.marker([p.lat,p.lon]).addTo(map);m.bindTooltip((i+1)+'. '+p.name,{permanent:true,direction:'right',className:'lbl'});m.bindPopup('<b>'+(i+1)+'. '+p.name+'</b><br>'+p.note);bounds.push([p.lat,p.lon]);});map.fitBounds(bounds,{padding:[35,35]});
</script></body></html>
